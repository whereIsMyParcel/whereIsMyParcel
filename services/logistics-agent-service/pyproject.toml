[project]
name = "logistics-agent-service"
version = "0.1.0"
description = "Logistics operations diagnosis agent service for WhereIsMyParcel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # ruff는 버전=lint 동작이라 정확히 핀 고정한다. 올릴 땐 의도적으로 핀을 올리고
    # 새 규칙에 걸리는 파일을 같은 PR에서 정리한다(lint 드리프트 방지).
    "ruff==0.15.22",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_agent_service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 관용구 (Depends 등)는 인자 기본값 함수 호출 허용
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# 계층 경계 강제 (design §17.4 / §17.6). Java 서비스의 ArchUnit에 대응한다.
[tool.importlinter]
root_package = "logistics_agent_service"

[[tool.importlinter.contracts]]
name = "domain은 바깥 계층에 의존하지 않는다"
type = "forbidden"
source_modules = ["logistics_agent_service.domain"]
forbidden_modules = [
    "logistics_agent_service.application",
    "logistics_agent_service.agent",
    "logistics_agent_service.infrastructure",
    "logistics_agent_service.presentation",
    "logistics_agent_service.core",
]

[[tool.importlinter.contracts]]
name = "application은 domain에만 의존한다"
type = "forbidden"
source_modules = ["logistics_agent_service.application"]
forbidden_modules = [
    "logistics_agent_service.agent",
    "logistics_agent_service.infrastructure",
    "logistics_agent_service.presentation",
    "logistics_agent_service.core",
]

[[tool.importlinter.contracts]]
name = "presentation은 infrastructure/agent를 직접 호출하지 않는다"
type = "forbidden"
source_modules = ["logistics_agent_service.presentation"]
forbidden_modules = [
    "logistics_agent_service.infrastructure",
    "logistics_agent_service.agent",
]

[[tool.importlinter.contracts]]
name = "agent는 infrastructure/presentation에 의존하지 않는다"
type = "forbidden"
source_modules = ["logistics_agent_service.agent"]
forbidden_modules = [
    "logistics_agent_service.infrastructure",
    "logistics_agent_service.presentation",
]

[[tool.importlinter.contracts]]
name = "infrastructure는 presentation/agent에 의존하지 않는다"
type = "forbidden"
source_modules = ["logistics_agent_service.infrastructure"]
forbidden_modules = [
    "logistics_agent_service.presentation",
    "logistics_agent_service.agent",
]
